<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" style="max-width:680px">
  <title>An interferometer with more than two paths</title>
  <desc>A photon fans out into eight paths, each carrying a phase that is a multiple of
  phi, and the paths recombine at a single detector. The more paths there are, the more
  sharply the amplitudes cancel away from phi equals zero.</desc>
  <style>
    .beam  { stroke: #c33b53; stroke-width: 1.6; fill: none; }
    .optic { stroke: #8a8f98; stroke-width: 3; fill: none; }
    text   { fill: #8a8f98; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
    .small { font-size: 12px; }
    .phase { fill: #17797c; font-size: 12px; font-family: ui-monospace, monospace; }
  </style>
  <defs>
    <marker id="np-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c33b53"/>
    </marker>
  </defs>

  <path class="beam" d="M 40 150 L 120 150" marker-end="url(#np-arrow)"/>
  <line class="optic" x1="120" y1="60" x2="120" y2="240"/>
  <line class="optic" x1="500" y1="60" x2="500" y2="240"/>

  <!-- eight paths, each with its own phase -->
  <path class="beam" d="M 120 62  L 220 62  L 400 62  L 500 62"/>
  <path class="beam" d="M 120 87  L 220 87  L 400 87  L 500 87"/>
  <path class="beam" d="M 120 112 L 220 112 L 400 112 L 500 112"/>
  <path class="beam" d="M 120 137 L 220 137 L 400 137 L 500 137"/>
  <path class="beam" d="M 120 162 L 220 162 L 400 162 L 500 162"/>
  <path class="beam" d="M 120 187 L 220 187 L 400 187 L 500 187"/>
  <path class="beam" d="M 120 212 L 220 212 L 400 212 L 500 212"/>
  <path class="beam" d="M 120 237 L 220 237 L 400 237 L 500 237"/>

  <text class="phase" x="310" y="58"  text-anchor="middle">0·φ</text>
  <text class="phase" x="310" y="83"  text-anchor="middle">1·φ</text>
  <text class="phase" x="310" y="108" text-anchor="middle">2·φ</text>
  <text class="phase" x="310" y="133" text-anchor="middle">3·φ</text>
  <text class="phase" x="310" y="158" text-anchor="middle">4·φ</text>
  <text class="phase" x="310" y="183" text-anchor="middle">5·φ</text>
  <text class="phase" x="310" y="208" text-anchor="middle">6·φ</text>
  <text class="phase" x="310" y="233" text-anchor="middle">7·φ</text>

  <path class="beam" d="M 500 150 L 570 150" marker-end="url(#np-arrow)"/>

  <text x="36" y="138" text-anchor="start">photon</text>
  <text class="small" x="120" y="266" text-anchor="middle">split into 2ⁿ paths</text>
  <text class="small" x="500" y="266" text-anchor="middle">recombine</text>
  <text class="small" x="574" y="140" text-anchor="start">detector</text>
  <text class="small" x="310" y="286" text-anchor="middle">each path carries a phase that is a multiple of φ</text>
</svg>
