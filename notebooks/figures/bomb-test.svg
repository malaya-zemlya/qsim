<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="100%" style="max-width:620px">
  <title>The Elitzur–Vaidman bomb tester</title>
  <desc>A Mach–Zehnder interferometer with a bomb placed in one arm. A live bomb absorbs
  any photon that takes that arm, which destroys the interference — so a click at port 1,
  which is dark when the interference is intact, proves the bomb is live without any
  photon having touched it.</desc>
  <style>
    .optic { stroke: #8a8f98; stroke-width: 3; fill: none; }
    .beam  { stroke: #c33b53; stroke-width: 2; fill: none; }
    .bomb  { stroke: #c33b53; stroke-width: 2.5; fill: none; }
    .box   { stroke: #17797c; stroke-width: 2; fill: none; }
    text   { fill: #8a8f98; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
    .small { font-size: 12px; }
    .accent { fill: #17797c; }
    .warn  { fill: #c33b53; }
  </style>
  <defs>
    <marker id="ev-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c33b53"/>
    </marker>
  </defs>

  <path class="beam" d="M 60 240 L 150 240" marker-end="url(#ev-arrow)"/>
  <path class="beam" d="M 150 240 L 450 240"/>
  <path class="beam" d="M 150 240 L 150 120"/>
  <path class="beam" d="M 150 120 L 262 120"/>
  <path class="beam" d="M 346 120 L 450 120"/>
  <path class="beam" d="M 450 240 L 450 120"/>
  <path class="beam" d="M 450 120 L 560 120" marker-end="url(#ev-arrow)"/>
  <path class="beam" d="M 450 120 L 450 46" marker-end="url(#ev-arrow)"/>

  <line class="optic" x1="132" y1="258" x2="168" y2="222"/>
  <line class="optic" x1="132" y1="138" x2="168" y2="102"/>
  <line class="optic" x1="432" y1="258" x2="468" y2="222"/>
  <line class="optic" x1="432" y1="138" x2="468" y2="102"/>

  <!-- the bomb, sitting in the upper arm -->
  <circle class="bomb" cx="304" cy="120" r="21"/>
  <path class="bomb" d="M 316 104 q 10 -12 18 -6"/>
  <text class="warn small" x="304" y="169" text-anchor="middle">bomb</text>
  <text class="warn small" x="304" y="185" text-anchor="middle">(absorbs a photon in arm 1)</text>

  <text x="56" y="228" text-anchor="start">photon</text>
  <text class="small" x="150" y="285" text-anchor="middle">beam splitter 1</text>
  <text class="small" x="450" y="285" text-anchor="middle">mirror</text>
  <text class="small" x="150" y="90" text-anchor="middle">mirror</text>
  <text class="small" x="470" y="90" text-anchor="start">beam splitter 2</text>
  <text class="small" x="215" y="273" text-anchor="middle">arm 0</text>
  <text x="566" y="125" text-anchor="start">port 0</text>
  <text class="accent" x="450" y="36" text-anchor="middle">port 1</text>
  <text class="accent small" x="450" y="20" text-anchor="middle">a click here means: live bomb</text>
</svg>
