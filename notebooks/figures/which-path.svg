<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="100%" style="max-width:620px">
  <title>A Mach–Zehnder interferometer with a which-path detector</title>
  <desc>The same interferometer, with a detector coupled to the upper arm. The more the
  detector learns about which arm the photon took, the weaker the interference at the
  output becomes.</desc>
  <style>
    .optic { stroke: #8a8f98; stroke-width: 3; fill: none; }
    .beam  { stroke: #c33b53; stroke-width: 2; fill: none; }
    .lead  { stroke: #17797c; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .box   { stroke: #17797c; stroke-width: 2; fill: none; }
    text   { fill: #8a8f98; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
    .small { font-size: 12px; }
    .accent { fill: #17797c; }
  </style>
  <defs>
    <marker id="wp-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c33b53"/>
    </marker>
  </defs>

  <path class="beam" d="M 60 240 L 150 240" marker-end="url(#wp-arrow)"/>
  <path class="beam" d="M 150 240 L 450 240"/>
  <path class="beam" d="M 150 240 L 150 130"/>
  <path class="beam" d="M 150 130 L 450 130"/>
  <path class="beam" d="M 450 240 L 450 130"/>
  <path class="beam" d="M 450 130 L 560 130" marker-end="url(#wp-arrow)"/>
  <path class="beam" d="M 450 130 L 450 70" marker-end="url(#wp-arrow)"/>

  <line class="optic" x1="132" y1="258" x2="168" y2="222"/>
  <line class="optic" x1="132" y1="148" x2="168" y2="112"/>
  <line class="optic" x1="432" y1="258" x2="468" y2="222"/>
  <line class="optic" x1="432" y1="148" x2="468" y2="112"/>

  <!-- the detector, coupled to the upper arm -->
  <rect class="box" x="238" y="20" width="132" height="46" rx="3"/>
  <text class="accent small" x="304" y="40" text-anchor="middle">detector</text>
  <text class="accent small" x="304" y="57" text-anchor="middle">Ry(θ) if arm 1</text>
  <path class="lead" d="M 304 66 L 304 130"/>

  <text x="56" y="228" text-anchor="start">photon</text>
  <text class="small" x="150" y="285" text-anchor="middle">beam splitter 1</text>
  <text class="small" x="450" y="285" text-anchor="middle">mirror</text>
  <text class="small" x="150" y="100" text-anchor="middle">mirror</text>
  <text class="small" x="470" y="100" text-anchor="start">beam splitter 2</text>
  <text class="small" x="200" y="122" text-anchor="middle">arm 1</text>
  <text class="small" x="215" y="273" text-anchor="middle">arm 0</text>
  <text x="566" y="135" text-anchor="start">port 0</text>
  <text x="450" y="60" text-anchor="middle" class="small">port 1</text>
</svg>
